// order.proto
syntax = "proto3";

package ecommerce;

import "product.proto";

service OrderService {
  rpc CreateOrder(OrderRequest) returns (OrderResponse);
}

message OrderRequest {
  int32 product_id = 1;
  int32 quantity = 2;
}

message OrderResponse {
  int32 order_id = 1;
  string product_name = 2;
  float total_price = 3;
}
